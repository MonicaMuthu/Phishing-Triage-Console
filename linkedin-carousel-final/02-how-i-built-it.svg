<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e2f7f5"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173d60" flood-opacity=".13"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="70" y="60" width="1460" height="780" rx="30" fill="#fff" filter="url(#shadow)"/><text x="125" y="145" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#087ec6" letter-spacing="2">02  |  HOW I BUILT IT</text><text x="125" y="220" font-family="Segoe UI,Arial" font-size="50" font-weight="700" fill="#0b1a2b">A phased approach to email triage</text><g font-family="Segoe UI,Arial"><rect x="125" y="300" width="300" height="220" rx="20" fill="#f2f8fd" stroke="#cfe0ee"/><text x="160" y="350" font-size="20" font-weight="700" fill="#087ec6">PHASE 1</text><text x="160" y="410" font-size="29" font-weight="600" fill="#0b1a2b">Parse the email</text><text x="160" y="460" font-size="22" fill="#56718d">Headers, body,</text><text x="160" y="493" font-size="22" fill="#56718d">URLs, attachments</text><rect x="475" y="300" width="300" height="220" rx="20" fill="#f2f8fd" stroke="#cfe0ee"/><text x="510" y="350" font-size="20" font-weight="700" fill="#087ec6">PHASE 2</text><text x="510" y="410" font-size="29" font-weight="600" fill="#0b1a2b">Detect signals</text><text x="510" y="460" font-size="22" fill="#56718d">Authentication,</text><text x="510" y="493" font-size="22" fill="#56718d">spoofing, content</text><rect x="825" y="300" width="300" height="220" rx="20" fill="#e8f8f6" stroke="#b9e8e3"/><text x="860" y="350" font-size="20" font-weight="700" fill="#0b7a79">PHASE 3</text><text x="860" y="410" font-size="29" font-weight="600" fill="#0b1a2b">Enrich and score</text><text x="860" y="460" font-size="22" fill="#56718d">ML analysis,</text><text x="860" y="493" font-size="22" fill="#56718d">VirusTotal, AbuseIPDB</text><rect x="1175" y="300" width="300" height="220" rx="20" fill="#e8f8f6" stroke="#b9e8e3"/><text x="1210" y="350" font-size="20" font-weight="700" fill="#0b7a79">PHASE 4</text><text x="1210" y="410" font-size="29" font-weight="600" fill="#0b1a2b">Support the analyst</text><text x="1210" y="460" font-size="22" fill="#56718d">Verdict, evidence,</text><text x="1210" y="493" font-size="22" fill="#56718d">case history, action</text></g><path d="M425 410h50M775 410h50M1125 410h50" stroke="#8ab8cf" stroke-width="5" stroke-dasharray="9 8"/><rect x="125" y="625" width="1350" height="82" rx="16" fill="#0b1a2b"/><text x="165" y="677" font-family="Segoe UI,Arial" font-size="26" font-weight="600" fill="#fff">The goal: reduce repetitive checks and give analysts a clear starting point.</text></svg>